<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amberline</title>
  </head>
  <body>
    <header id="titlebar" data-tauri-drag-region>
      <div class="titlebar-left">
        <span class="app-dot"></span>
        <span class="app-title">Amberline</span>
        <div class="space-switch">
          <button type="button" class="space-btn active" id="mode-chats">Chats</button>
          <button type="button" class="space-btn" id="mode-projects">Projects</button>
        </div>
      </div>
      <div class="window-controls">
        <button type="button" class="win-btn" id="win-min" title="Minimize">—</button>
        <button type="button" class="win-btn" id="win-max" title="Maximize">□</button>
        <button type="button" class="win-btn close" id="win-close" title="Close">✕</button>
      </div>
    </header>

    <div id="app">
      <aside id="side">
        <div class="side-head"><button id="ws" title="Open a folder in a new session">open folder</button></div>
        <div id="tree"></div>
      </aside>

      <main id="main">
        <header id="top">
          <div id="tabs"></div>
          <button id="btn-add" title="New session (Ctrl+T)">+</button>
          <button id="btn-convert" class="hidden" title="Connect a folder and turn this chat into an agent project">Connect Project</button>
          <span class="spacer"></span>
          <button id="btn-stats">Stats</button>
          <button id="btn-settings">Settings</button>
          <button id="btn-panel" title="Show or hide the activity panel">Activity</button>
        </header>
        <div id="feeds"></div>
        <div id="composer">
          <div class="input-wrap">
            <textarea id="input" rows="1" placeholder="Ask anything. Use @file to reference a file. Enter sends, Shift+Enter adds a line."></textarea>
            <div class="hint"><span id="state">ready</span><span id="model"></span></div>
          </div>
        </div>
      </main>

      <aside id="panel">
        <div class="panel-head"><span>Activity</span><button id="panel-close" title="Hide panel">Hide</button></div>
        <div id="panel-body">
          <details class="sec" open>
            <summary>This session</summary>
            <div id="panel-session"></div>
          </details>
          <details class="sec" open>
            <summary>Timeline</summary>
            <div id="timelines"></div>
          </details>
          <details class="sec" open>
            <summary>Last run</summary>
            <div id="panel-last"></div>
          </details>
        </div>
      </aside>
    </div>

    <dialog id="settings">
      <div class="set-wrap">
        <nav id="set-nav"></nav>
        <section id="set-pane"></section>
      </div>
      <div class="actions">
        <button type="button" id="s-cancel">Cancel</button>
        <button type="button" id="s-save" class="primary">Save</button>
      </div>
    </dialog>

    <dialog id="update-dialog">
      <div class="update-box">
        <div class="update-badge">UPDATE AVAILABLE</div>
        <h3 id="u-version">Version 0.1.x is ready</h3>
        <div id="u-notes" class="update-notes"></div>
        <div id="u-progress" class="update-progress hidden">
          <div class="progress-bar"><div id="u-progress-fill"></div></div>
          <span id="u-status">Downloading &amp; installing update…</span>
        </div>
        <div class="update-actions" id="u-actions">
          <button type="button" id="u-later">Later</button>
          <button type="button" id="u-install" class="primary">Update &amp; Restart</button>
        </div>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
